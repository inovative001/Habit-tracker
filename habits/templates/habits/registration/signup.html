{% extends 'habits/base.html' %}

{% block content %}
    <section class="card">
        <h2>Sign Up</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Create Account</button>
        </form>
        <p>Already have an account? <a href="{% url 'login' %}">Log In</a></p>
    </section>
{% endblock %}
